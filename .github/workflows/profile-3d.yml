name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: '{"type":"normal","fileName":"profile-imperial.svg","backgroundColor":"#0d1117","foregroundColor":"#E0B853","strongColor":"#E0B853","weakColor":"#8B949E","radarColor":"#C0392B","contribColors":["#161b22","#4A3F24","#7D6836","#B39347","#E0B853"]}'
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "chore: update 3d contribution terrain" || exit 0
          git push
          
